<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForzaPartTool 2.0.0</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="stylesheet" href="/style.css">
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js",
               "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<header id="top">
  <strong id="brand">ForzaPartTool</strong>
  <button id="btnCars">Cars</button>
  <button id="btnUnload">Unload car</button>
  <button id="btnSettings">Settings</button>
  <button id="btnCustomModel">Custom model…</button>
  <button id="btnApplyCar">Apply to existing car</button>
  <button id="btnCarZip">Export car ZIP…</button>
  <button id="btnDlc">Export as new DLC car</button>
  <label class="btn">Open .carbin<input id="fileIn" type="file" accept=".carbin" hidden></label>
  <button id="btnUndo" title="Ctrl+Z">Undo</button>
  <button id="btnRedo" title="Ctrl+Y">Redo</button>
  <button id="btnSave">Download .carbin</button>
  <button id="btnExport">Export OBJ</button>
  <span id="fileName" class="muted">no file open</span>
  <select id="siblings" hidden title="The other models of this car: driving, close-up / photo, and cockpit (the sharp interior)"></select>
</header>
<main>
  <aside id="left">
    <div class="bar">
      <input id="filter" placeholder="filter parts or materials">
      <button id="btnHide" title="hide the selected part (Ctrl+H)">Hide</button><button id="btnIso" title="show only the selected part (Ctrl+I)">Isolate</button><button id="btnShowAll" title="show every part (Ctrl+Shift+H)">Show all</button>
    </div>
    <div class="bar" id="lodBar"></div>
    <div id="tree"></div>
  </aside>
  <section id="view">
    <div id="viewOpts">
      <label><input type="checkbox" id="optWire"> wireframe</label>
      <label>texture <select id="optTex"><option value="auto" selected>all textures (body, lamps, interior)</option><option value="off">off</option><option value="damage">damage</option><option value="nodamage">inspect body atlas</option><option value="lights">inspect lamp atlas</option><option value="interior">inspect interior atlas</option></select></label>
      <label title="The car file holds one wheel at the centre; the game puts it at the four corners. 'none' hides the wheels and puts the floor under the car body, which suits cars that look too high."><select id="optWheels"><option value="corners" selected>wheels at the corners</option><option value="none">no wheels</option><option value="file">wheel as in the file (centre)</option></select></label>
      <label title="Draws the sharp interior of the car's cockpit model in place of this model's low-detail interior. Preview only; no file is changed."><input type="checkbox" id="optCockpit" checked> sharp interior</label>
      <label><input type="checkbox" id="optNormals"> normals</label>
      <label><input type="checkbox" id="optBoxes"> all boxes</label>
      <label><input type="checkbox" id="optBox" checked> selection box</label>
      <label><input type="checkbox" id="optLights" checked> lights</label>
      <label><input type="checkbox" id="optEx" checked> exhausts</label>
      <label><input type="checkbox" id="optHidden" checked> parts the game does not draw</label>
      <span class="muted">front = -z (arrow)</span>
    </div>
    <canvas id="gl"></canvas>
    <div id="loading" role="status" aria-live="polite" hidden><div class="track"><div id="loadFill"></div></div><span id="loadText"></span></div>
    <div id="transformTools" aria-label="Viewport transform tools">
      <span id="gizmoTarget">Select a part to move it</span>
      <button data-gizmo-mode="translate" disabled>Move (W)</button>
      <button data-gizmo-mode="rotate" disabled>Rotate (E)</button>
      <button data-gizmo-mode="scale" disabled>Scale (R)</button>
      <label title="Move 1 cm, rotate 1 degree, scale 1 %. Hold Alt to turn snapping off while you drag; let go and it comes back."><input id="snapOn" type="checkbox" checked> Snap</label>
      <label title="Scale all sides together, so one handle resizes the whole part. Hold Shift to do the opposite for one drag."><input id="uniformScale" type="checkbox" checked> Scale all sides together</label>
      <span id="snapHint" class="muted"></span>
      <label><input id="partBoth" type="checkbox" checked disabled> Driving + photo models</label>
    </div>
  </section>
  <aside id="right">
    <nav id="tabs">
      <button data-tab="cars">Cars</button>
      <button data-tab="settings">Settings</button>
      <button data-tab="parts">Copy parts</button>
      <button data-tab="part" class="on">Part</button>
      <button data-tab="model">Custom models</button>
      <button data-tab="lights">Lights</button>
      <button data-tab="exhausts">Exhausts</button>
      <button data-tab="physics">Physics</button>
      <button data-tab="skeleton">Skeleton</button>
      <button data-tab="archive">Archive</button>
      <button data-tab="strings">Strings</button>
      <button data-tab="file">Open / Save</button>
    </nav>
    <div id="tab-cars" class="tab" hidden></div>
    <div id="tab-settings" class="tab" hidden></div>
    <div id="tab-parts" class="tab" hidden></div>
    <div id="tab-part" class="tab"></div>
    <div id="tab-model" class="tab" hidden></div>
    <div id="tab-lights" class="tab" hidden></div>
    <div id="tab-exhausts" class="tab" hidden></div>
    <div id="tab-physics" class="tab" hidden></div>
    <div id="tab-skeleton" class="tab" hidden></div>
    <div id="tab-archive" class="tab" hidden></div>
    <div id="tab-strings" class="tab" hidden></div>
    <div id="tab-file" class="tab" hidden></div>
  </aside>
</main>
<section id="errorBanner" role="alert" hidden>
  <label for="errorText">Editor error</label>
  <textarea id="errorText" readonly spellcheck="false" aria-label="Error details"></textarea>
  <button id="copyError">Copy error</button><button id="dismissError">Dismiss</button>
</section>
<footer id="status">ready</footer>
<input id="objIn" type="file" accept=".obj" hidden>
<input id="modelIn" type="file" accept=".fbx,.glb,.gltf,.obj,.modelbin" hidden>
<datalist id="materials"></datalist>
<script src="/startup_diagnostics.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
